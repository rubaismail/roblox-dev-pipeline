name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the exact tool versions pinned in rokit.toml.
      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: rokit install --no-trust-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: StyLua
        run: stylua --check .

      - name: Selene
        run: selene .

      # Pure game logic (scoring, flight, station rules) runs outside Studio with Lune.
      - name: Specs
        run: |
          for game in games/*/; do
            lune run tools/run-specs "${game%/}"
          done

      # Catches a broken Rojo project before anyone opens it in Studio.
      - name: Rojo build
        run: |
          for game in games/*/; do
            rojo build "${game%/}/default.project.json" --output "$RUNNER_TEMP/$(basename "$game").rbxl"
          done
